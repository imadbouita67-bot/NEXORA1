<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA OS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <style>
    /* ========== GLOBAL ========== */
    :root {
      --bg-dark: #05070c;
      --panel-bg: rgba(18, 25, 40, 0.95);
      --accent: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.4);
      --text-main: #eef5ff;
      --text-muted: #8ba0b8;
      --border: rgba(0, 210, 255, 0.2);
      --font: 'Segoe UI', 'Inter', system-ui, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: #000; height: 100vh; overflow: hidden; font-family: var(--font); color: var(--text-main); }

    /* ========== OS SHELL ========== */
    .os-shell { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; overflow: hidden; transition: background 0.8s ease; background-size: cover; background-position: center; }
    .os-shell[data-wall="space"] { background-image: radial-gradient(circle at 50% 50%, #1a2b4a, #030614), url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=1920&auto=format&fit=crop'); background-blend-mode: overlay; }
    .os-shell[data-wall="nature"] { background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1920&auto=format&fit=crop'); }
    .os-shell[data-wall="logo"] { background-image: radial-gradient(circle at 50% 50%, #0d111c, #000), url('https://images.unsplash.com/photo-1614729939124-03290b560f43?q=80&w=1920&auto=format&fit=crop'); background-blend-mode: multiply; }
    .os-shell[data-wall="custom"] { background-size: cover; background-position: center; }
    .wallpaper-glow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.1), transparent 70%); pointer-events: none; z-index: 0; }

    /* ========== TOP BAR ========== */
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 18px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); z-index: 100; height: 48px; flex-shrink: 0; }
    .brand-button { display: flex; align-items: center; gap: 10px; background: transparent; border: none; color: white; font-weight: 600; font-size: 1rem; cursor: pointer; padding: 6px 12px; border-radius: 30px; transition: background 0.2s; }
    .brand-button:hover { background: rgba(255, 255, 255, 0.1); }
    .brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; background: var(--accent); color: #000; border-radius: 8px; font-weight: 800; font-size: 1.1rem; box-shadow: 0 0 12px var(--accent-glow); }
    .top-center { font-size: 0.8rem; opacity: 0.7; }
    .top-status { display: flex; align-items: center; gap: 12px; }
    .top-icon { background: transparent; border: none; color: white; font-size: 1.2rem; cursor: pointer; padding: 6px; border-radius: 30px; transition: all 0.2s; }
    .top-icon:hover { background: rgba(255, 255, 255, 0.1); transform: scale(1.1); }
    .clock-button { background: transparent; border: none; color: white; display: flex; flex-direction: column; align-items: flex-end; font-size: 0.85rem; cursor: pointer; padding: 6px 12px; border-radius: 30px; }
    .clock-button:hover { background: rgba(255, 255, 255, 0.1); }
    .clock-button small { font-size: 0.65rem; opacity: 0.7; }

    /* ========== DESKTOP ========== */
    .desktop { flex: 1; position: relative; overflow: hidden; z-index: 10; }
    .desktop-icons { position: absolute; top: 30px; left: 30px; display: flex; flex-direction: column; gap: 28px; z-index: 20; }
    .desktop-icon { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 84px; padding: 8px 4px; border-radius: 12px; color: white; font-size: 0.75rem; text-align: center; cursor: grab; transition: all 0.15s; background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(4px); border: 1px solid transparent; position: absolute; }
    .desktop-icon:active { cursor: grabbing; }
    .desktop-icon:hover { background: rgba(0, 210, 255, 0.2); border-color: var(--accent); transform: scale(1.05); }
    .desktop-icon i { font-size: 2rem; filter: drop-shadow(0 0 6px var(--accent-glow)); }

    .context-menu { position: absolute; background: var(--panel-bg); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 12px; padding: 8px; z-index: 1000; box-shadow: 0 10px 30px #000a; min-width: 180px; animation: fadeIn 0.1s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .ctx-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; transition: background 0.1s; }
    .ctx-item:hover { background: rgba(0, 210, 255, 0.2); }
    .ctx-item.danger { color: #ff5555; }
    .ctx-item.danger:hover { background: rgba(255, 85, 85, 0.2); }
    .ctx-divider { height: 1px; background: #ffffff10; margin: 6px 0; }

    /* ========== WINDOWS ========== */
    .window-layer { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
    .os-window { position: absolute; width: 780px; height: 520px; background: var(--panel-bg); backdrop-filter: blur(18px); border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px var(--accent-glow); display: flex; flex-direction: column; pointer-events: auto; color: var(--text-main); overflow: hidden; animation: windowPop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1); transition: all 0.3s ease; }
    .os-window.closing { animation: windowClose 0.2s ease forwards; }
    .os-window.maximized { border-radius: 0; border: none; }
    .os-window.minimized { opacity: 0; transform: scale(0.8) translateY(100px); pointer-events: none; }
    @keyframes windowPop { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes windowClose { to { opacity: 0; transform: scale(0.9) translateY(20px); } }
    .window-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: rgba(0, 0, 0, 0.3); border-bottom: 1px solid var(--border); cursor: grab; flex-shrink: 0; }
    .window-header:active { cursor: grabbing; }
    .window-title { font-weight: 500; display: flex; align-items: center; gap: 10px; }
    .window-controls { display: flex; gap: 8px; }
    .win-ctrl { width: 28px; height: 28px; border-radius: 50%; border: none; background: rgba(255, 255, 255, 0.08); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; transition: all 0.15s; }
    .win-ctrl:hover { background: var(--accent); color: #000; }
    .win-ctrl.close:hover { background: #ff4444; color: white; }
    .window-body { flex: 1; overflow-y: auto; padding: 20px; background: rgba(10, 15, 25, 0.6); display: flex; flex-direction: column; }

    /* ========== TASKBAR ========== */
    .taskbar { display: flex; align-items: center; padding: 0 18px; height: 56px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); border-top: 1px solid var(--border); z-index: 200; flex-shrink: 0; gap: 16px; }
    .taskbar-button { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05); border: none; color: white; padding: 8px 16px; border-radius: 40px; cursor: pointer; font-size: 0.85rem; transition: all 0.15s; }
    .taskbar-button:hover { background: rgba(0, 210, 255, 0.2); transform: scale(1.02); }
    .start-menu-btn { width: 42px; height: 42px; border-radius: 10px; background: rgba(0, 210, 255, 0.1); border: 1px solid var(--border); color: var(--accent); font-size: 1.5rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .start-menu-btn:hover { background: var(--accent); color: #000; transform: scale(1.05); box-shadow: 0 0 15px var(--accent-glow); }
    .taskbar-apps { display: flex; gap: 8px; flex: 1; align-items: center; }
    .taskbar-app-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; background: rgba(0, 0, 0, 0.3); border: 1px solid transparent; cursor: pointer; transition: all 0.15s; color: white; position: relative; }
    .taskbar-app-icon:hover { transform: translateY(-2px); }
    .taskbar-app-icon.active { background: rgba(0, 210, 255, 0.3); border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
    .taskbar-app-icon.minimized { background: rgba(0, 80, 255, 0.4); border-color: #0080ff; box-shadow: 0 0 8px rgba(0, 128, 255, 0.5); }
    .taskbar-app-icon.multi { background: rgba(160, 0, 255, 0.4); border-color: #a000ff; box-shadow: 0 0 8px rgba(160, 0, 255, 0.5); }
    .taskbar-app-icon::after { content: ''; position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); width: 16px; height: 2px; border-radius: 2px; opacity: 0; transition: opacity 0.2s; }
    .taskbar-app-icon.active::after { background: var(--accent); opacity: 1; }
    .taskbar-app-icon.minimized::after { background: #0080ff; opacity: 1; }
    .taskbar-app-icon.multi::after { background: #a000ff; opacity: 1; }
    .taskbar-right { display: flex; align-items: center; gap: 16px; }
    .taskbar-tray { display: flex; gap: 10px; background: transparent; border: none; color: white; font-size: 1.1rem; cursor: pointer; padding: 6px 12px; border-radius: 30px; }
    .taskbar-tray:hover { background: rgba(255, 255, 255, 0.1); }
    .taskbar-clock { background: transparent; border: none; color: white; display: flex; flex-direction: column; align-items: flex-end; font-size: 0.8rem; cursor: pointer; padding: 6px 12px; border-radius: 30px; }
    .taskbar-clock small { font-size: 0.6rem; opacity: 0.7; }

    /* ========== POPOVERS ========== */
    .popover { position: absolute; background: var(--panel-bg); backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: 20px; padding: 20px; box-shadow: 0 20px 40px #000a, 0 0 30px var(--accent-glow); color: var(--text-main); z-index: 300; width: 320px; animation: fadeSlide 0.2s ease; }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .hidden { display: none !important; }
    .quick-panel { bottom: 70px; right: 100px; width: 300px; }
    .quick-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #ffffff10; }
    .toggle { width: 44px; height: 24px; background: #444; border-radius: 30px; position: relative; cursor: pointer; transition: background 0.2s; }
    .toggle.active { background: var(--accent); }
    .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: white; border-radius: 50%; transition: transform 0.2s; }
    .toggle.active::after { transform: translateX(20px); }

    .app-drawer { position: absolute; bottom: 70px; left: 80px; width: 400px; max-height: 500px; background: var(--panel-bg); backdrop-filter: blur(24px); border: 1px solid var(--border); border-radius: 20px; padding: 20px; overflow-y: auto; z-index: 300; box-shadow: 0 20px 40px #000a; animation: fadeSlide 0.2s ease; display: flex; flex-direction: column; gap: 20px; }
    .drawer-section h4 { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
    .drawer-apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .drawer-app { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); cursor: pointer; transition: all 0.1s; text-align: center; font-size: 0.7rem; position: relative; }
    .drawer-app:hover { background: rgba(0, 210, 255, 0.2); transform: scale(1.05); }
    .drawer-app i { font-size: 1.5rem; color: var(--accent); }
    .drawer-app .pin-indicator { position: absolute; top: 5px; right: 5px; font-size: 0.6rem; color: var(--accent); }

    /* ========== NEXTOR ========== */
    .store-header { background: linear-gradient(90deg, #ff3366, #ff9933, #00d2ff, #a000ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2rem; font-weight: 900; letter-spacing: 3px; margin-bottom: 20px; text-shadow: 0 0 40px rgba(255, 51, 102, 0.6); animation: gradientShift 3s ease infinite; background-size: 300% 300%; }
    @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .store-sections { display: flex; gap: 12px; margin-bottom: 25px; overflow-x: auto; padding: 15px; border-bottom: 2px solid var(--border); background: rgba(0,0,0,0.3); border-radius: 16px; position: relative; }
    .store-section-btn { background: rgba(255,255,255,0.05); border: 2px solid var(--border); color: var(--text-muted); padding: 12px 24px; border-radius: 30px; cursor: pointer; font-weight: 700; font-size: 0.9rem; transition: all 0.3s; white-space: nowrap; display: flex; align-items: center; gap: 10px; position: relative; overflow: hidden; }
    .store-section-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transition: left 0.5s; }
    .store-section-btn:hover::before { left: 100%; }
    .store-section-btn.active { background: linear-gradient(135deg, var(--accent), #a000ff); color: #000; box-shadow: 0 0 25px var(--accent-glow), 0 0 50px rgba(160,0,255,0.4); border-color: var(--accent); transform: scale(1.05); }
    .store-section-btn:hover:not(.active) { background: rgba(0, 210, 255, 0.15); transform: translateY(-3px); border-color: var(--accent); }
    .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 10px 0; }
    .store-card { background: rgba(255, 255, 255, 0.04); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--border); transition: all 0.3s; cursor: pointer; animation: fadeSlide 0.3s ease; position: relative; overflow: hidden; }
    .store-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(0,210,255,0.1) 0%, transparent 70%); opacity: 0; transition: opacity 0.3s; }
    .store-card:hover::before { opacity: 1; }
    .store-card:hover { background: rgba(0, 210, 255, 0.1); transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 30px var(--accent-glow); border-color: var(--accent); }
    .store-card .icon-large { font-size: 3rem; text-align: center; color: var(--accent); filter: drop-shadow(0 0 15px var(--accent-glow)); transition: transform 0.3s; }
    .store-card:hover .icon-large { transform: scale(1.2) rotate(5deg); }
    .store-card .store-title { font-weight: 700; font-size: 1.1rem; }
    .store-card .store-desc { font-size: 0.8rem; opacity: 0.8; line-height: 1.4; }
    .install-btn { background: linear-gradient(135deg, var(--accent), #0080ff); border: none; color: #000; font-weight: 700; padding: 10px 18px; border-radius: 25px; cursor: pointer; margin-top: 8px; align-self: flex-start; transition: all 0.2s; font-size: 0.85rem; box-shadow: 0 0 15px var(--accent-glow); z-index: 2; position: relative; }
    .install-btn:hover { background: linear-gradient(135deg, #0cf, #00d2ff); transform: scale(1.08); box-shadow: 0 0 25px var(--accent-glow); }
    .install-btn:disabled { background: #444; color: #888; cursor: not-allowed; box-shadow: none; }

    /* ========== VYRO ========== */
    .vyro-container { display: flex; flex-direction: column; height: 100%; background: #1a1a2e; }
    .vyro-toolbar { background: #0f0f1a; padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid var(--accent); align-items: center; }
    .vyro-tool { background: rgba(255,255,255,0.08); border: 1px solid var(--border); color: white; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: all 0.2s; position: relative; }
    .vyro-tool:hover { background: rgba(0,210,255,0.2); border-color: var(--accent); transform: scale(1.1); }
    .vyro-tool.active { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent-glow); }
    .vyro-color { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid white; transition: transform 0.2s; }
    .vyro-color:hover { transform: scale(1.2); }
    .vyro-color.active { border: 3px solid var(--accent); transform: scale(1.15); }
    .vyro-canvas-wrapper { flex: 1; position: relative; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #vyroCanvas { background: #000; cursor: crosshair; display: block; }
    .vyro-menu { display: flex; flex-direction: column; gap: 15px; padding: 20px; overflow-y: auto; flex: 1; }
    .vyro-project-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 20px; cursor: pointer; transition: all 0.2s; border: 1px solid var(--border); position: relative; }
    .vyro-project-card:hover { background: rgba(0,210,255,0.1); transform: translateX(10px); border-color: var(--accent); }
    .vyro-project-card .icon { font-size: 3rem; color: var(--accent); }
    .vyro-project-card .info { flex: 1; }
    .vyro-project-card .info h3 { margin-bottom: 5px; }
    .vyro-project-card .info p { opacity: 0.7; font-size: 0.85rem; }
    .vyro-project-card .delete-project-btn { background: rgba(255,51,102,0.2); color: #ff3366; border: 1px solid #ff3366; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .vyro-project-card .delete-project-btn:hover { background: #ff3366; color: white; transform: scale(1.1); }
    .vyro-add-btn { background: linear-gradient(135deg, var(--accent), #a000ff); border: none; color: #000; padding: 20px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s; }
    .vyro-add-btn:hover { transform: scale(1.02); box-shadow: 0 0 30px var(--accent-glow); }
    /* Objetos sobre el canvas */
    .vyro-object { position: absolute; cursor: move; border: 2px dashed transparent; transition: border 0.2s; }
    .vyro-object:hover { border-color: var(--accent); }
    .vyro-object.selected { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
    .vyro-object img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .vyro-object .obj-text { padding: 5px; white-space: nowrap; pointer-events: none; }
    .vyro-object .remove-obj { position: absolute; top: -10px; right: -10px; background: #ff3366; color: white; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; opacity: 0; transition: opacity 0.2s; z-index: 10; }
    .vyro-object:hover .remove-obj { opacity: 1; }
    .vyro-object .resize-handle { position: absolute; bottom: -5px; right: -5px; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; cursor: se-resize; opacity: 0; transition: opacity 0.2s; }
    .vyro-object:hover .resize-handle { opacity: 1; }

    /* ========== BROWSER ========== */
    .browser-bar { display: flex; gap: 10px; padding: 8px; background: #00000040; border-radius: 30px; margin-bottom: 16px; }
    .browser-bar input { flex: 1; background: rgba(255, 255, 255, 0.08); border: none; border-radius: 30px; padding: 8px 16px; color: white; outline: none; font-size: 0.85rem; }
    .browser-bar button { background: var(--accent); border: none; color: black; font-weight: bold; padding: 8px 18px; border-radius: 30px; cursor: pointer; transition: background 0.15s; }
    .browser-bar button:hover { background: #0cf; }
    .browser-layout { display: flex; flex-direction: column; height: 100%; }
    .browser-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .b-tab { background: rgba(255, 255, 255, 0.05); border: none; color: var(--text-muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
    .b-tab.active { background: var(--accent); color: #000; font-weight: bold; }
    .browser-view { background: #1a1f2b; border-radius: 12px; flex: 1; overflow: auto; border: 1px solid var(--border); position: relative; }
    .browser-home { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #b0c8e0; text-align: center; padding: 20px; }
    .browser-home i { font-size: 3rem; color: var(--accent); margin-bottom: 12px; }
    .browser-home h2 { font-weight: 400; margin-bottom: 6px; }
    .browser-home p { font-size: 0.8rem; opacity: 0.6; margin-bottom: 20px; }
    .recent-searches { width: 100%; max-width: 400px; text-align: left; background: rgba(0,0,0,0.2); border-radius: 12px; padding: 16px; }
    .recent-searches h4 { margin-bottom: 10px; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
    .recent-item { padding: 8px 0; border-bottom: 1px solid #ffffff10; cursor: pointer; font-size: 0.9rem; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
    .recent-item:hover { color: var(--accent); }
    .recent-item:last-child { border-bottom: none; }
    .indirect-search-view { padding: 20px; }
    .indirect-tabs { display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid #ffffff10; padding-bottom: 10px; flex-wrap: wrap; }
    .i-tab { background: transparent; border: none; color: var(--text-muted); font-size: 0.9rem; cursor: pointer; padding: 6px 12px; border-radius: 8px; transition: all 0.2s; }
    .i-tab.active { background: rgba(0, 210, 255, 0.2); color: var(--accent); }
    .i-content { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .img-card { background: #111; border-radius: 8px; overflow: hidden; height: 120px; display: flex; align-items: center; justify-content: center; color: #555; font-size: 2rem; }
    .shop-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; }
    .shop-item .price { color: #0f0; font-weight: bold; }

    /* ========== SETTINGS ========== */
    .settings-tabs { display: flex; gap: 16px; margin-bottom: 20px; border-bottom: 1px solid #ffffff10; padding-bottom: 10px; overflow-x: auto; }
    .settings-tab { background: transparent; border: none; color: #aac; padding: 8px 4px; cursor: pointer; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }

    /* ========== MAPS ========== */

    .map-3d-btn:hover { transform: scale(1.05); }

    /* ========== NEXOBLOX ========== */

    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; }

    .notes-editor { flex: 1; display: flex; flex-direction: column; }
    .notes-editor textarea { flex: 1; background: #ffffff08; color: white; border: none; padding: 15px; border-radius: 12px; resize: none; font-size: 1rem; line-height: 1.5; }
    .notes-editor textarea:focus { outline: 1px solid var(--accent); }
    .add-note-btn { background: var(--accent); color: #000; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 1rem; }

    /* ========== WEATHER ========== */
    .weather-app { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; }
    .weather-search { display: flex; gap: 10px; margin-bottom: 30px; width: 100%; max-width: 400px; }
    .weather-search input { flex: 1; background: rgba(255,255,255,0.1); border: 1px solid var(--border); border-radius: 30px; padding: 12px 20px; color: white; outline: none; }
    .weather-search button { background: var(--accent); border: none; color: #000; padding: 0 20px; border-radius: 30px; cursor: pointer; font-weight: bold; }
    .weather-card { background: rgba(0,0,0,0.4); padding: 30px; border-radius: 20px; text-align: center; border: 1px solid var(--border); }
    .weather-card .temp { font-size: 4rem; font-weight: bold; color: var(--accent); }
    .weather-card .city { font-size: 1.5rem; margin-bottom: 10px; }
    .weather-card .desc { opacity: 0.8; text-transform: capitalize; }

    /* ========== LOCK & OVERLAY ========== */
    .lock-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
    .lock-user { display: flex; flex-direction: column; align-items: center; gap: 15px; animation: fadeSlide 0.5s ease; }
    .lock-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #000; margin-bottom: 10px; }
    .lock-input { background: rgba(255,255,255,0.1); border: 1px solid var(--border); padding: 12px 20px; border-radius: 30px; color: white; outline: none; text-align: center; font-size: 1.2rem; letter-spacing: 5px; width: 200px; margin-top: 10px; }
    .lock-btn { background: var(--accent); border: none; padding: 10px 30px; border-radius: 30px; font-weight: bold; cursor: pointer; margin-top: 20px; color: #000; transition: all 0.2s; }
    .lock-btn:hover { background: #0cf; transform: scale(1.05); }
    .system-overlay { position: absolute; inset: 0; background: #05070c; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: white; font-size: 1.4rem; backdrop-filter: blur(20px); transition: opacity 0.4s; }
    .system-overlay .spinner { width: 48px; height: 48px; border: 4px solid rgba(0,210,255,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== FILES & CALC ========== */
    .files-sidebar { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 10px; }
    .files-sidebar button { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .files-sidebar button:hover { background: rgba(0,210,255,0.2); }
    .files-sidebar button.active { background: var(--accent); color: #000; }
    .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; animation: fadeSlide 0.3s ease; }
    .file-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 12px; cursor: pointer; transition: all 0.2s; }
    .file-item:hover { background: rgba(0, 210, 255, 0.1); transform: translateY(-2px); }
    .file-item i { font-size: 2.5rem; color: var(--accent); }
    .file-item span { font-size: 0.8rem; text-align: center; }
    .calc-display { width: 100%; padding: 20px; font-size: 2rem; text-align: right; background: #000; border: 1px solid var(--accent); color: var(--accent); border-radius: 12px; margin-bottom: 15px; font-family: monospace; }
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .calc-btn { padding: 20px; font-size: 1.3rem; border: none; border-radius: 12px; background: rgba(255,255,255,0.08); color: white; cursor: pointer; transition: all 0.15s; }
    .calc-btn:hover { background: rgba(0,210,255,0.3); transform: scale(1.02); }
    .calc-btn.op { background: rgba(0,210,255,0.2); color: var(--accent); }
    .calc-btn.eq { background: var(--accent); color: #000; font-weight: bold; }
    .calc-btn.clear { background: rgba(255,85,85,0.3); color: #ff5555; }

<body>

  <main id="os" class="os-shell" data-wall="space">
    <div class="wallpaper-glow"></div>

    <header class="topbar">
      <button class="brand-button" id="startBtn">
        <span class="brand-mark">N</span> <span>NEXORA</span>
      </button>
      <div class="top-center" id="topDate"></div>
      <div class="top-status">
        <button class="top-icon" id="wifiBtn"><i class="fa-solid fa-wifi"></i></button>
        <button class="top-icon" id="btBtn"><i class="fa-brands fa-bluetooth-b"></i></button>
        <button class="clock-button" id="notifBtn">
          <span id="topTime">--:--</span><small id="topShortDate"></small>
        </button>
      </div>
    </header>

    <section class="desktop" id="desktop">
      <nav class="desktop-icons" id="desktopIcons"></nav>
      <div class="window-layer" id="windowLayer"></div>
      <div class="context-menu hidden" id="contextMenu"></div>

      <section class="popover quick-panel hidden" id="quickPanel">
        <h3 style="margin-bottom:12px;">Ajustes Rápidos</h3>
        <div class="quick-row"><span><i class="fa-solid fa-wifi"></i> Wi-Fi</span><div class="toggle active" onclick="this.classList.toggle('active')"></div></div>
        <div class="quick-row"><span><i class="fa-brands fa-bluetooth-b"></i> Bluetooth</span><div class="toggle active" onclick="this.classList.toggle('active')"></div></div>
        <div class="quick-row" style="border:none;"><span><i class="fa-solid fa-moon"></i> Luz nocturna</span><div class="toggle" onclick="this.classList.toggle('active')"></div></div>
      </section>

      <div class="system-overlay hidden" id="systemOverlay">
        <div class="spinner"></div>
        <div id="overlayMessage">Reiniciando NEXORA OS...</div>
      </div>

      <div class="lock-screen hidden" id="lockScreen"></div>
    </section>

    <footer class="taskbar">
      <button class="taskbar-button" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
      <button class="start-menu-btn" id="nexoraMenuBtn">N</button>
      <div class="taskbar-apps" id="taskbarApps"></div>
      <div class="taskbar-right">
        <button class="taskbar-tray" id="trayBtn"><i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-volume-high"></i></button>
        <button class="taskbar-clock" id="clockBtn">
          <span id="taskbarTime">--:--</span><small id="taskbarDate"></small>
        </button>
      </div>
    </footer>
  </main>

  <script>
    (function() {
      // ========== SOUND ENGINE ==========
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      let audioCtx;
      function playSound(type) {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        const config = {
          click: { type:'sine', f1:800, f2:300, dur:0.1, vol:0.1 },
          open: { type:'triangle', f1:400, f2:800, dur:0.15, vol:0.15 },
          close: { type:'triangle', f1:800, f2:300, dur:0.15, vol:0.15 },
          error: { type:'sawtooth', f1:200, f2:200, dur:0.3, vol:0.15 },
          shoot: { type:'square', f1:1200, f2:200, dur:0.08, vol:0.08 },
          explosion: { type:'sawtooth', f1:100, f2:50, dur:0.3, vol:0.2 },
        };
        const c = config[type] || config.click;
        osc.type = c.type;
        osc.frequency.setValueAtTime(c.f1, now);
        osc.frequency.exponentialRampToValueAtTime(c.f2, now + c.dur);
        gain.gain.setValueAtTime(c.vol, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + c.dur);
        osc.start(now); osc.stop(now + c.dur);
      }

      // ========== INDEXEDDB ==========
      let db;
      const request = indexedDB.open('NexoraMediaDB', 1);
      request.onupgradeneeded = (e) => { db = e.target.result; if (!db.objectStoreNames.contains('media')) db.createObjectStore('media', { keyPath: 'id', autoIncrement: true }); };
      request.onsuccess = (e) => { db = e.target.result; };
      function saveMedia(type, dataUrl) { if (!db) return; const tx = db.transaction('media', 'readwrite'); tx.objectStore('media').add({ type, dataUrl, date: new Date().toISOString() }); }
      function getMedia(cb) { if (!db) return cb([]); const tx = db.transaction('media', 'readonly'); const req = tx.objectStore('media').getAll(); req.onsuccess = () => cb(req.result); }
      function deleteMedia(id, cb) { if (!db) return; const tx = db.transaction('media', 'readwrite'); tx.objectStore('media').delete(id); tx.oncomplete = () => cb(); }

      // ========== STATE ==========
      const state = {
        wall: localStorage.getItem('nexora_wall') || 'space',
        customWall: localStorage.getItem('nexora_custom_wall') || null,
        windows: [], zIndex: 100,
        installedApps: JSON.parse(localStorage.getItem('nexora_apps')) || [],
        pinnedApps: JSON.parse(localStorage.getItem('nexora_pinned')) || ['store', 'nova', 'settings', 'files'],
        recentSearches: JSON.parse(localStorage.getItem('nexora_searches')) || [],
        pin: localStorage.getItem('nexora_pin') || '1234',
        autoLogin: localStorage.getItem('nexora_auto') === 'true',
        userName: localStorage.getItem('nexora_username') || 'Usuario NEXORA',
        contextTarget: null,
        iconPositions: JSON.parse(localStorage.getItem('nexora_icon_pos')) || {},
        notes: JSON.parse(localStorage.getItem('nexora_notes')) || [{ id: Date.now(), title: 'Nota 1', content: '' }],
        activeNoteId: null,
        storageUsed: JSON.parse(localStorage.getItem('nexora_storage_used')) || 12,
        storageTotal: 500,
        vyroProjects: JSON.parse(localStorage.getItem('nexora_vyro_projects')) || [],
      };
      state.activeNoteId = state.notes.length > 0 ? state.notes[0].id : null;

      const osShell = document.getElementById('os');
      const desktopIcons = document.getElementById('desktopIcons');
      const windowLayer = document.getElementById('windowLayer');
      const quickPanel = document.getElementById('quickPanel');
      const systemOverlay = document.getElementById('systemOverlay');
      const overlayMessage = document.getElementById('overlayMessage');
      const taskbarApps = document.getElementById('taskbarApps');
      const lockScreen = document.getElementById('lockScreen');
      const contextMenu = document.getElementById('contextMenu');

      if (state.customWall) { osShell.dataset.wall = 'custom'; osShell.style.backgroundImage = `url('${state.customWall}')`; } else { osShell.dataset.wall = state.wall; }

      // ========== APPS ==========
      const BASE_APPS = {
        store: { name: 'NEXTOR', icon: '<i class="fa-solid fa-cart-shopping"></i>', width: 900, height: 650, category: 'Sistema', size: 0 },
        nova: { name: 'NOVA', icon: '<i class="fa-solid fa-globe"></i>', width: 900, height: 650, category: 'Internet', size: 0.1 },
        settings: { name: 'Ajustes', icon: '<i class="fa-solid fa-gear"></i>', width: 780, height: 540, category: 'Sistema', size: 0 },
        files: { name: 'Archivos', icon: '<i class="fa-solid fa-folder"></i>', width: 800, height: 550, category: 'Sistema', size: 0 },
      };

      const STORE_APPS = [
        { id: 'nexoblox', name: 'NEXOBLOX', icon: 'fa-cube', desc: 'Juegos 3D únicos. Explora mundos.', category: 'Juegos', width: 1000, height: 700, size: 15 },
        { id: 'vyro', name: 'VYRO', icon: 'fa-paint-brush', desc: 'Estudio de dibujo y pintura', category: 'Multimedia', width: 950, height: 700, size: 8 },
        { id: 'maps', name: 'Mapas 3D', icon: 'fa-map-location-dot', desc: 'Explora el mundo en 3D y satélite', category: 'Información', width: 950, height: 700, size: 12 },
        { id: 'camera', name: 'Cámara', icon: 'fa-camera', desc: 'Fotos, videos y audio', category: 'Multimedia', width: 750, height: 650, size: 5 },
        { id: 'gallery', name: 'Galería', icon: 'fa-images', desc: 'Fotos, videos y audios con zoom', category: 'Multimedia', width: 850, height: 650, size: 3 },
        { id: 'code', name: 'Code Editor', icon: 'fa-code', desc: 'IDE ligero', category: 'Desarrollo', width: 800, height: 600, size: 2 },
        { id: 'terminal', name: 'Terminal', icon: 'fa-terminal', desc: 'Línea de comandos', category: 'Desarrollo', width: 700, height: 500, size: 1 },
        { id: 'calendar', name: 'Calendario', icon: 'fa-calendar', desc: 'Festivos reales y navegación anual', category: 'Productividad', width: 700, height: 550, size: 1 },
        { id: 'notes', name: 'Notas', icon: 'fa-pen', desc: 'Crea y guarda múltiples notas', category: 'Productividad', width: 750, height: 550, size: 1 },
        { id: 'weather', name: 'Clima', icon: 'fa-cloud-sun', desc: 'Clima real de cualquier ciudad', category: 'Información', width: 600, height: 500, size: 2 },
        { id: 'calculator', name: 'Calculadora', icon: 'fa-calculator', desc: 'Calculadora básica', category: 'Productividad', width: 400, height: 550, size: 0.5 },
        { id: 'game1', name: 'Space Shooter', icon: 'fa-rocket', desc: 'Juego arcade espacial', category: 'Juegos', width: 800, height: 600, size: 4 },
        { id: 'game2', name: 'Snake', icon: 'fa-gamepad', desc: 'El clásico juego de la serpiente', category: 'Juegos', width: 600, height: 600, size: 2 },
        { id: 'game3', name: 'Tetris', icon: 'fa-cubes', desc: 'El clásico juego de bloques', category: 'Juegos', width: 500, height: 650, size: 2 },
        { id: 'video', name: 'Video Player', icon: 'fa-video', desc: 'Reproduce tus videos', category: 'Entretenimiento', width: 700, height: 500, size: 2 },
      ];

      // ========== CLOCK ==========
      function updateClock() {
        const now = new Date();
        const t = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const d = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
        document.getElementById('topTime').textContent = t;
        document.getElementById('topShortDate').textContent = d;
        document.getElementById('taskbarTime').textContent = t;
        document.getElementById('taskbarDate').textContent = d;
        document.getElementById('topDate').textContent = now.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      }
      setInterval(updateClock, 1000); updateClock();

      // ========== STORAGE ==========
      function updateStorage() {
        let used = 12;
        state.installedApps.forEach(id => { const app = STORE_APPS.find(a => a.id === id); if (app) used += app.size; });
        state.storageUsed = used;
        localStorage.setItem('nexora_storage_used', JSON.stringify(used));
      }
      updateStorage();

      function getStorageInfo() {
        const used = state.storageUsed; const total = state.storageTotal;
        const percent = (used / total) * 100;
        return { used, total, percent };
      }

      // ========== DESKTOP ICONS ==========
      function renderDesktopIcons() {
        desktopIcons.innerHTML = '';
        const allApps = { ...BASE_APPS };
        state.installedApps.forEach(appId => { const storeApp = STORE_APPS.find(a => a.id === appId); if (storeApp) allApps[appId] = storeApp; });
        let index = 0;
        Object.entries(allApps).forEach(([id, app]) => {
          const div = document.createElement('div'); div.className = 'desktop-icon'; div.dataset.appId = id;
          div.innerHTML = `${app.icon.includes('<i') ? app.icon : `<i class="fa-solid ${app.icon}"></i>`}<span>${app.name}</span>`;
          const savedPos = state.iconPositions[id];
          if (savedPos) { div.style.left = savedPos.x + 'px'; div.style.top = savedPos.y + 'px'; }
          else { div.style.left = '30px'; div.style.top = (30 + index * 100) + 'px'; }
          index++;
          div.addEventListener('click', (e) => { if (div.dataset.dragged === 'true') { div.dataset.dragged = 'false'; return; } playSound('click'); openApp(id); });
          div.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); showContextMenu(e.clientX, e.clientY, 'app', id); });
          makeIconDraggable(div, id);
          desktopIcons.appendChild(div);
        });
      }

      function makeIconDraggable(el, appId) {
        let isDragging = false, startX, startY, origX, origY;
        el.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          isDragging = false; startX = e.clientX; startY = e.clientY;
          origX = parseInt(el.style.left) || 30; origY = parseInt(el.style.top) || 30;
          const onMouseMove = (ev) => { const dx = ev.clientX - startX; const dy = ev.clientY - startY; if (Math.abs(dx) > 5 || Math.abs(dy) > 5) { isDragging = true; el.dataset.dragged = 'true'; el.style.left = (origX + dx) + 'px'; el.style.top = (origY + dy) + 'px'; } };
          const onMouseUp = () => { document.removeEventListener('mousemove', onMouseMove); document.removeEventListener('mouseup', onMouseUp); if (isDragging) { state.iconPositions[appId] = { x: parseInt(el.style.left), y: parseInt(el.style.top) }; localStorage.setItem('nexora_icon_pos', JSON.stringify(state.iconPositions)); } };
          document.addEventListener('mousemove', onMouseMove); document.addEventListener('mouseup', onMouseUp);
        });
      }

      // ========== CONTEXT MENU ==========
      function showContextMenu(x, y, type, targetId = null) {
        state.contextTarget = { type, targetId };
        contextMenu.classList.remove('hidden');
        let html = '';
        if (type === 'desktop') {
          html = `<div class="ctx-item" onclick="window.refreshDesktop()"><i class="fa-solid fa-rotate"></i> Actualizar</div>
            <div class="ctx-item" onclick="window.openApp('nova')"><i class="fa-solid fa-globe"></i> Abrir NOVA</div>
            <div class="ctx-item" onclick="window.openApp('settings')"><i class="fa-solid fa-gear"></i> Ajustes</div>
            <div class="ctx-divider"></div>
            <div class="ctx-item" onclick="window.showWallpaperChanger()"><i class="fa-solid fa-palette"></i> Cambiar fondo</div>`;
        } else if (type === 'app') {
          const isBase = BASE_APPS[targetId]; const isPinned = state.pinnedApps.includes(targetId);
          html = `<div class="ctx-item" onclick="window.openApp('${targetId}'); window.hideContextMenu();"><i class="fa-solid fa-folder-open"></i> Abrir</div>
            <div class="ctx-item" onclick="window.togglePin('${targetId}')"><i class="fa-solid fa-thumbtack"></i> ${isPinned ? 'Desanclar de la barra' : 'Anclar a la barra'}</div>
            ${!isBase ? `<div class="ctx-divider"></div><div class="ctx-item danger" onclick="window.uninstallApp('${targetId}')"><i class="fa-solid fa-trash"></i> Desinstalar</div>` : ''}`;
        } else if (type === 'taskbarWin') {
          html = `<div class="ctx-item" onclick="window.closeWindowById('${targetId}'); window.hideContextMenu();"><i class="fa-solid fa-xmark"></i> Cerrar ventana</div>`;
        } else if (type === 'drawerApp') {
          const isPinned = state.pinnedApps.includes(targetId);
          html = `<div class="ctx-item" onclick="window.openApp('${targetId}'); window.hideContextMenu();"><i class="fa-solid fa-folder-open"></i> Abrir</div>
            <div class="ctx-item" onclick="window.togglePin('${targetId}')"><i class="fa-solid fa-thumbtack"></i> ${isPinned ? 'Desanclar de la barra' : 'Anclar a la barra'}</div>`;
        }
        contextMenu.innerHTML = html;
        contextMenu.style.left = x + 'px'; contextMenu.style.top = y + 'px';
      }

      window.hideContextMenu = () => contextMenu.classList.add('hidden');
      window.refreshDesktop = () => { renderDesktopIcons(); window.hideContextMenu(); playSound('click'); };
      window.openApp = openApp;
      window.closeWindowById = (winId) => { playSound('close'); closeWindow(winId); };
      window.togglePin = (appId) => { if (state.pinnedApps.includes(appId)) state.pinnedApps = state.pinnedApps.filter(id => id !== appId); else state.pinnedApps.push(appId); localStorage.setItem('nexora_pinned', JSON.stringify(state.pinnedApps)); window.hideContextMenu(); renderTaskbarApps(); playSound('click'); };
      window.uninstallApp = (appId) => {
        state.installedApps = state.installedApps.filter(id => id !== appId);
        localStorage.setItem('nexora_apps', JSON.stringify(state.installedApps));
        state.pinnedApps = state.pinnedApps.filter(id => id !== appId);
        localStorage.setItem('nexora_pinned', JSON.stringify(state.pinnedApps));
        updateStorage(); renderDesktopIcons(); renderTaskbarApps();
        if (state.windows.some(w => w.appId === appId)) { state.windows = state.windows.filter(w => w.appId !== appId); renderWindows(); }
        window.hideContextMenu(); playSound('close');
      };
      window.showWallpaperChanger = () => { const walls = ['space', 'nature', 'logo']; const next = walls[(walls.indexOf(state.wall) + 1) % walls.length]; state.wall = next; state.customWall = null; osShell.dataset.wall = next; osShell.style.backgroundImage = ''; localStorage.setItem('nexora_wall', next); localStorage.removeItem('nexora_custom_wall'); window.hideContextMenu(); playSound('click'); };
      document.addEventListener('click', (e) => { if (!e.target.closest('.context-menu')) window.hideContextMenu(); });
      document.getElementById('desktop').addEventListener('contextmenu', (e) => { if (e.target.closest('.os-window') || e.target.closest('.desktop-icon')) return; e.preventDefault(); showContextMenu(e.clientX, e.clientY, 'desktop'); });

      // ========== APP DRAWER ==========
      const appDrawer = document.createElement('div'); appDrawer.className = 'app-drawer hidden'; appDrawer.id = 'appDrawer';
      document.querySelector('.desktop').appendChild(appDrawer);

      function renderAppDrawer() {
        const recentApps = state.windows.map(w => w.appId).filter((v, i, a) => a.indexOf(v) === i).slice(0, 8);
        const categories = {};
        const allAvailable = [...Object.keys(BASE_APPS), ...state.installedApps];
        allAvailable.forEach(id => { let app = BASE_APPS[id] || STORE_APPS.find(a => a.id === id); if (app) { const cat = app.category || 'Otros'; if (!categories[cat]) categories[cat] = []; if (!categories[cat].find(a => a.id === id)) categories[cat].push({ id, ...app }); } });
        let pinnedHtml = state.pinnedApps.map(id => { let app = BASE_APPS[id] || STORE_APPS.find(a => a.id === id); return app ? `<div class="drawer-app" data-app-id="${id}" onclick="window.openApp('${id}'); document.getElementById('appDrawer').classList.add('hidden');"><i class="fa-solid ${app.icon.includes('<i') ? app.icon.match(/fa-[a-z-]+/)[0] : app.icon}"></i><span>${app.name}</span><i class="fa-solid fa-thumbtack pin-indicator"></i></div>` : ''; }).join('');
        let recentHtml = recentApps.map(id => { let app = BASE_APPS[id] || STORE_APPS.find(a => a.id === id); return app ? `<div class="drawer-app" data-app-id="${id}" onclick="window.openApp('${id}'); document.getElementById('appDrawer').classList.add('hidden');"><i class="fa-solid ${app.icon.includes('<i') ? app.icon.match(/fa-[a-z-]+/)[0] : app.icon}"></i><span>${app.name}</span></div>` : ''; }).join('');
        let catHtml = Object.entries(categories).map(([cat, apps]) => `<div class="drawer-section"><h4>${cat}</h4><div class="drawer-apps">${apps.map(app => `<div class="drawer-app" data-app-id="${app.id}" onclick="window.openApp('${app.id}'); document.getElementById('appDrawer').classList.add('hidden');"><i class="fa-solid ${app.icon.includes('<i') ? app.icon.match(/fa-[a-z-]+/)[0] : app.icon}"></i><span>${app.name}</span></div>`).join('')}</div></div>`).join('');
        appDrawer.innerHTML = `${pinnedHtml ? `<div class="drawer-section"><h4>Ancladas</h4><div class="drawer-apps">${pinnedHtml}</div></div>` : ''}${recentHtml ? `<div class="drawer-section"><h4>Recientes</h4><div class="drawer-apps">${recentHtml}</div></div>` : ''}${catHtml}`;
        appDrawer.querySelectorAll('.drawer-app').forEach(app => { app.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); const appId = app.dataset.appId; showContextMenu(e.clientX, e.clientY, 'drawerApp', appId); }); });
      }

      document.getElementById('nexoraMenuBtn').addEventListener('click', (e) => { e.stopPropagation(); playSound('click'); if (appDrawer.classList.contains('hidden')) { renderAppDrawer(); appDrawer.classList.remove('hidden'); } else appDrawer.classList.add('hidden'); });
      document.addEventListener('click', (e) => { if (!e.target.closest('#appDrawer') && !e.target.closest('#nexoraMenuBtn')) appDrawer.classList.add('hidden'); });

      // ========== OPEN APP ==========
      function openApp(appId) {
        playSound('open');
        const existing = state.windows.find(w => w.appId === appId);
        if (existing) { if (existing.minimized) { existing.minimized = false; existing.zIndex = ++state.zIndex; renderWindows(); } else { existing.zIndex = ++state.zIndex; renderWindows(); } return; }
        let def = BASE_APPS[appId] || STORE_APPS.find(a => a.id === appId);
        if (!def) return;
        const newWin = { id: 'win-' + Date.now(), appId, title: def.name, icon: def.icon.includes('<i') ? def.icon : `<i class="fa-solid ${def.icon}"></i>`, x: 120 + (state.windows.length * 30), y: 80 + (state.windows.length * 30), w: def.width || 800, h: def.height || 500, zIndex: ++state.zIndex, minimized: false, maximized: false };
        state.windows.push(newWin); renderWindows();
      }

      // ========== RENDER WINDOWS ==========
      function renderWindows() {
        document.querySelectorAll('.os-window').forEach(el => el.remove());
        state.windows.forEach(win => {
          if (win.minimized) return;
          const el = document.createElement('div');
          el.className = 'os-window' + (win.maximized ? ' maximized' : '');
          el.id = win.id;
          el.style.left = win.x + 'px'; el.style.top = win.y + 'px'; el.style.width = win.w + 'px'; el.style.height = win.h + 'px'; el.style.zIndex = win.zIndex;
          el.innerHTML = `<div class="window-header"><div class="window-title">${win.icon} ${win.title}</div><div class="window-controls"><button class="win-ctrl minimize"><i class="fa-solid fa-minus"></i></button><button class="win-ctrl maximize"><i class="fa-regular fa-square"></i></button><button class="win-ctrl close"><i class="fa-solid fa-xmark"></i></button></div></div><div class="window-body" id="body-${win.id}"></div>`;
          windowLayer.appendChild(el);
          const body = el.querySelector('.window-body');
          if (win.appId === 'store') buildStore(body);
          else if (win.appId === 'nova') buildNova(body, win.id);
          else if (win.appId === 'settings') buildSettings(body);
          else if (win.appId === 'files') buildFiles(body);
          else if (win.appId === 'camera') buildCamera(body);
          else if (win.appId === 'gallery') buildGallery(body);
          else if (win.appId === 'calculator') buildCalculator(body);
          else if (win.appId === 'game1') buildSpaceShooter(body, win);
          else if (win.appId === 'maps') buildMaps(body);
          else if (win.appId === 'nexoblox') buildNexoblox(body);
          else if (win.appId === 'game2') buildSnake(body, win);
          else if (win.appId === 'game3') buildTetris(body, win);
          else if (win.appId === 'weather') buildWeather(body);
          else if (win.appId === 'calendar') buildCalendar(body);
          else if (win.appId === 'notes') buildNotes(body);
          else if (win.appId === 'vyro') buildVyro(body);
          else buildGenericApp(body, win.appId);

          el.querySelector('.close').addEventListener('click', () => { playSound('close'); el.classList.add('closing'); setTimeout(() => closeWindow(win.id), 200); });
          el.querySelector('.minimize').addEventListener('click', () => { playSound('click'); win.minimized = true; renderWindows(); renderTaskbarApps(); });
          el.querySelector('.maximize').addEventListener('click', () => { playSound('click'); win.maximized = !win.maximized; if (win.maximized) { win.oldX = win.x; win.oldY = win.y; win.oldW = win.w; win.oldH = win.h; win.x = 0; win.y = 0; win.w = window.innerWidth; win.h = window.innerHeight - 104; } else { win.x = win.oldX || 120; win.y = win.oldY || 80; win.w = win.oldW || 800; win.h = win.oldH || 500; } renderWindows(); });
          makeDraggable(el, el.querySelector('.window-header'), win);
          el.addEventListener('mousedown', () => { win.zIndex = ++state.zIndex; el.style.zIndex = win.zIndex; });
        });
        renderTaskbarApps();
      }

      function closeWindow(winId) { state.windows = state.windows.filter(w => w.id !== winId); renderWindows(); }

      function makeDraggable(el, handle, win) {
        if (win.maximized) return;
        let startX, startY, startLeft, startTop;
        handle.addEventListener('mousedown', (e) => { if (e.target.closest('.win-ctrl')) return; startX = e.clientX; startY = e.clientY; startLeft = win.x; startTop = win.y; document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp); });
        function onMove(e) { win.x = startLeft + (e.clientX - startX); win.y = startTop + (e.clientY - startY); el.style.left = win.x + 'px'; el.style.top = win.y + 'px'; }
        function onUp() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
      }

      // ========== TASKBAR ==========
      function renderTaskbarApps() {
        taskbarApps.innerHTML = '';
        const openApps = [...new Set(state.windows.map(w => w.appId))];
        openApps.forEach(appId => {
          let def = BASE_APPS[appId] || STORE_APPS.find(a => a.id === appId);
          if (!def) return;
          const windowsForApp = state.windows.filter(w => w.appId === appId);
          const hasActive = windowsForApp.some(w => !w.minimized);
          const hasMinimized = windowsForApp.some(w => w.minimized);
          const div = document.createElement('div');
          div.className = 'taskbar-app-icon';
          if (windowsForApp.length > 1) div.classList.add('multi');
          else if (hasMinimized && !hasActive) div.classList.add('minimized');
          else if (hasActive) div.classList.add('active');
          div.innerHTML = def.icon.includes('<i') ? def.icon : `<i class="fa-solid ${def.icon}"></i>`;
          div.title = def.name + (windowsForApp.length > 1 ? ` (${windowsForApp.length})` : '');
          div.addEventListener('click', () => { playSound('click'); openApp(appId); });
          div.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); showContextMenu(e.clientX, e.clientY, 'app', appId); });
          taskbarApps.appendChild(div);
        });
        state.pinnedApps.forEach(appId => {
          if (openApps.includes(appId)) return;
          let def = BASE_APPS[appId] || STORE_APPS.find(a => a.id === appId);
          if (def) {
            const div = document.createElement('div'); div.className = 'taskbar-app-icon';
            div.innerHTML = def.icon.includes('<i') ? def.icon : `<i class="fa-solid ${def.icon}"></i>`; div.title = def.name;
            div.addEventListener('click', () => { playSound('click'); openApp(appId); });
            div.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); showContextMenu(e.clientX, e.clientY, 'app', appId); });
            taskbarApps.appendChild(div);
          }
        });
      }

      // ========== NEXTOR ==========
      function buildStore(container) {
        const categories = [
          { id: 'all', name: 'Todos', icon: 'fa-th-large' },
          { id: 'Juegos', name: 'Juegos', icon: 'fa-gamepad' },
          { id: 'Entretenimiento', name: 'Entretenimiento', icon: 'fa-film' },
          { id: 'Multimedia', name: 'Multimedia', icon: 'fa-photo-video' },
          { id: 'Productividad', name: 'Productividad', icon: 'fa-briefcase' },
          { id: 'Desarrollo', name: 'Desarrollo', icon: 'fa-code' },
          { id: 'Información', name: 'Información', icon: 'fa-info-circle' },
        ];
        let activeCat = 'all';

        function renderStore() {
          const filtered = activeCat === 'all' ? STORE_APPS : STORE_APPS.filter(a => a.category === activeCat);
          container.innerHTML = `
            <div class="store-header"><i class="fa-solid fa-bolt"></i> NEXTOR</div>
            <div class="store-sections">
              ${categories.map(c => `<button class="store-section-btn ${c.id === activeCat ? 'active' : ''}" data-cat="${c.id}"><i class="fa-solid ${c.icon}"></i> ${c.name}</button>`).join('')}
            </div>
            <div class="store-grid" id="storeGrid">
              ${filtered.map(app => {
                const isInstalled = state.installedApps.includes(app.id);
                return `<div class="store-card">
                  <div class="icon-large"><i class="fa-solid ${app.icon}"></i></div>
                  <div class="store-title">${app.name}</div>
                  <div class="store-desc">${app.desc} <span style="opacity:0.6; font-size:0.7rem;">(${app.size} GB)</span></div>
                  <button class="install-btn" data-app="${app.id}" ${isInstalled ? 'disabled' : ''}>${isInstalled ? 'Instalado' : 'Instalar'}</button>
                </div>`;
              }).join('')}
            </div>
          `;
          container.querySelectorAll('.store-section-btn').forEach(btn => { btn.addEventListener('click', () => { playSound('click'); activeCat = btn.dataset.cat; renderStore(); }); });
          container.querySelectorAll('.install-btn').forEach(btn => {
            if (btn.disabled) return;
            btn.addEventListener('click', (e) => {
              e.preventDefault(); e.stopPropagation();
              const appId = btn.dataset.app;
              if (!state.installedApps.includes(appId)) {
                playSound('click');
                state.installedApps.push(appId);
                localStorage.setItem('nexora_apps', JSON.stringify(state.installedApps));
                btn.textContent = 'Instalado'; btn.disabled = true;
                updateStorage(); renderDesktopIcons();
              }
            });
          });
        }
        renderStore();
      }

      // ========== VYRO (MEJORADO) ==========
      function buildVyro(container) {
        if (!state.vyroProjects) state.vyroProjects = [];

        function renderMenu() {
          container.innerHTML = `
            <div class="vyro-container">
              <div class="vyro-menu">
                <h2 style="color:var(--accent); margin-bottom:20px;"><i class="fa-solid fa-paint-brush"></i> VYRO - Tus Proyectos</h2>
                <button class="vyro-add-btn" id="vyroAddBtn"><i class="fa-solid fa-plus"></i> Crear Nuevo Dibujo</button>
                ${state.vyroProjects.map((proj, i) => `
                  <div class="vyro-project-card" data-idx="${i}">
                    <div class="icon">🎨</div>
                    <div class="info"><h3>${proj.name}</h3><p>Creado: ${new Date(proj.date).toLocaleDateString()}</p></div>
                    <button class="delete-project-btn" data-idx="${i}" title="Eliminar proyecto"><i class="fa-solid fa-trash"></i></button>
                  </div>
                `).join('')}
                ${state.vyroProjects.length === 0 ? '<p style="opacity:0.5; text-align:center; padding:20px;">No hay proyectos. ¡Crea uno nuevo!</p>' : ''}
              </div>
            </div>
          `;
          container.querySelector('#vyroAddBtn').addEventListener('click', () => {
            playSound('click');
            const name = prompt('Nombre del proyecto:', 'Dibujo ' + (state.vyroProjects.length + 1));
            if (!name) return;
            state.vyroProjects.push({ name, date: Date.now(), data: null, objects: [] });
            localStorage.setItem('nexora_vyro_projects', JSON.stringify(state.vyroProjects));
            renderMenu();
          });
          container.querySelectorAll('.vyro-project-card').forEach(card => {
            card.addEventListener('click', (e) => {
              if (e.target.closest('.delete-project-btn')) return;
              playSound('open');
              openProject(parseInt(card.dataset.idx));
            });
          });
          container.querySelectorAll('.delete-project-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              if (!confirm('¿Eliminar este proyecto?')) return;
              playSound('close');
              state.vyroProjects.splice(parseInt(btn.dataset.idx), 1);
              localStorage.setItem('nexora_vyro_projects', JSON.stringify(state.vyroProjects));
              renderMenu();
            });
          });
        }

        function openProject(idx) {
          const proj = state.vyroProjects[idx];
          if (!proj.objects) proj.objects = [];

          container.innerHTML = `
            <div class="vyro-container">
              <div class="vyro-toolbar">
                <button class="vyro-tool active" data-tool="pencil" title="Lápiz"><i class="fa-solid fa-pencil"></i></button>
                <button class="vyro-tool" data-tool="brush" title="Pincel"><i class="fa-solid fa-paint-brush"></i></button>
                <button class="vyro-tool" data-tool="eraser" title="Borrador"><i class="fa-solid fa-eraser"></i></button>
                <button class="vyro-tool" data-tool="line" title="Línea"><i class="fa-solid fa-slash"></i></button>
                <button class="vyro-tool" data-tool="rect" title="Rectángulo"><i class="fa-regular fa-square"></i></button>
                <button class="vyro-tool" data-tool="circle" title="Círculo"><i class="fa-regular fa-circle"></i></button>
                <button class="vyro-tool" data-tool="text" title="Añadir Texto"><i class="fa-solid fa-font"></i></button>
                <button class="vyro-tool" data-tool="image" title="Insertar Imagen"><i class="fa-solid fa-image"></i></button>
                <div style="display:flex; gap:5px; align-items:center; margin-left:10px;">
                  ${['#ff0000','#ff6600','#ffff00','#00ff00','#00d2ff','#0000ff','#a000ff','#ff00ff','#ffffff','#000000'].map(c => `<div class="vyro-color" style="background:${c};" data-color="${c}"></div>`).join('')}
                </div>
                <input type="range" id="vyroSize" min="1" max="50" value="5" style="width:100px; margin-left:10px;">
                <button class="vyro-tool" id="vyroSave" title="Guardar" style="margin-left:auto; background:var(--accent); color:#000;"><i class="fa-solid fa-save"></i></button>
                <button class="vyro-tool" id="vyroBack" title="Volver"><i class="fa-solid fa-arrow-left"></i></button>
              </div>
              <div class="vyro-canvas-wrapper" id="vyroCanvasWrapper">
                <canvas id="vyroCanvas" width="800" height="500"></canvas>
              </div>
            </div>
          `;

          const canvas = container.querySelector('#vyroCanvas');
          const ctx = canvas.getContext('2d');
          const wrapper = container.querySelector('#vyroCanvasWrapper');
          let isDrawing = false, lastX = 0, lastY = 0;
          let currentTool = 'pencil', currentColor = '#ffffff', currentSize = 5;

          // Configurar canvas al tamaño del wrapper
          function resizeCanvas() {
            const rect = wrapper.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            if (proj.data) {
              const img = new Image();
              img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              img.src = proj.data;
            }
          }
          setTimeout(resizeCanvas, 100);

          // Cargar objetos guardados
          function renderObjects() {
            wrapper.querySelectorAll('.vyro-object').forEach(o => o.remove());
            proj.objects.forEach((obj, i) => {
              const el = document.createElement('div');
              el.className = 'vyro-object';
              el.dataset.objIdx = i;
              el.style.left = obj.x + 'px';
              el.style.top = obj.y + 'px';
              el.style.width = obj.w + 'px';
              el.style.height = obj.h + 'px';

              if (obj.type === 'image') {
                el.innerHTML = `<img src="${obj.src}"><button class="remove-obj" title="Eliminar"><i class="fa-solid fa-xmark"></i></button><div class="resize-handle"></div>`;
              } else if (obj.type === 'text') {
                el.innerHTML = `<div class="obj-text" style="color:${obj.color}; font-family:${obj.font}; font-size:${obj.size}px; font-weight:${obj.bold?'bold':'normal'}; font-style:${obj.italic?'italic':'normal'}; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">${obj.text}</div><button class="remove-obj" title="Eliminar"><i class="fa-solid fa-xmark"></i></button>`;
                el.style.width = 'auto';
                el.style.height = 'auto';
              }

              el.querySelector('.remove-obj').addEventListener('click', (e) => {
                e.stopPropagation();
                playSound('close');
                proj.objects.splice(i, 1);
                localStorage.setItem('nexora_vyro_projects', JSON.stringify(state.vyroProjects));
                renderObjects();
              });

              // Drag para mover
              let dragging = false, startX, startY, origX, origY;
              el.addEventListener('mousedown', (e) => {
                if (e.target.closest('.remove-obj') || e.target.closest('.resize-handle')) return;
                e.stopPropagation();
                dragging = true;
                startX = e.clientX; startY = e.clientY;
                origX = obj.x; origY = obj.y;
                el.classList.add('selected');
                const onMove = (ev) => {
                  if (!dragging) return;
                  obj.x = origX + (ev.clientX - startX);
                  obj.y = origY + (ev.clientY - startY);
                  el.style.left = obj.x + 'px';
                  el.style.top = obj.y + 'px';
                };
                const onUp = () => {
                  dragging = false;
                  el.classList.remove('selected');
                  localStorage.setItem('nexora_vyro_projects', JSON.stringify(state.vyroProjects));
                  document.removeEventListener('mousemove', onMove);
                  document.removeEventListener('mouseup', onUp);
                };
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
              });

              // Resize para imágenes
              const resizeHandle = el.querySelector('.resize-handle');
              if (resizeHandle) {
                let resizing = false, startX, startY, origW, origH;
                resizeHandle.addEventListener('mousedown', (e) => {
                  e.stopPropagation();
                  resizing = true;
                  startX = e.clientX; startY = e.clientY;
                  origW = obj.w; origH = obj.h;
                  const onMove = (ev) => {
                    if (!resizing) return;
                    obj.w = Math.max(50, origW + (ev.clientX - startX));
                    obj.h = Math.max(50, origH + (ev.clientY - startY));
                    el.style.width = obj.w + 'px';
                    el.style.height = obj.h + 'px';
                  };
                  const onUp = () => {
                    resizing = false;
                    localStorage.setItem('nexora_vyro_projects', JSON.stringify(state.vyroProjects));
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                  };
                  document.addEventListener('mousemove', onMove);
                  document.addEventListener('mouseup', onUp);
                });
              }

              wrapper.appendChild(el);
            });
          }
          renderObjects();

          // Herramientas
          container.querySelectorAll('.vyro-tool[data-tool]').forEach(btn => {
            btn.addEventListener('click', () => {
              playSound('click');
              currentTool = btn.dataset.tool;
              container.querySelectorAll('.vyro-tool[data-tool]').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
            });
          });
          container.querySelectorAll('.vyro-color').forEach(el => {
            el.addEventListener('click', () => {
              playSound('click');
              currentColor = el.dataset.color;
              container.querySelectorAll('.vyro-color').forEach(c => c.classList.remove('active'));
              el.classList.add('active');
            });
          });
          container.querySelector('#vyroSize').addEventListener('input', (e) => { currentSize = parseInt(e.target.value); });

          // Guardar
          container.querySelector('#vyroSave').addEventListener('click', () => {
            proj.data = canvas.toDataURL();
            localStorage.setItem('nexora_vyro_projects', JSON.stringify(state.vyroProjects));
            alert('¡Dibujo guardado!');
            playSound('open');
          });
          container.querySelector('#vyroBack').addEventListener('click', () => { playSound('close'); renderMenu(); });

          // Dibujo
          canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;

            if (currentTool === 'text') {
              const txt = prompt('Escribe el texto:');
              if (!txt) return;
              const font = prompt('Estilo de letra (Arial, Impact, Courier New, Times New Roman):', 'Arial') || 'Arial';
              const size = prompt('Tamaño de letra:', '40') || '40';
              const color = prompt('Color (hexadecimal, ej: #00d2ff):', currentColor) || currentColor;
              proj.objects.push({ type: 'text', text: txt, x: lastX, y: lastY, color, font, size: parseInt(size), bold: true, italic: false });
              localStorage.setItem('nexora_vyro_projects', JSON.stringify(state.vyroProjects));
              renderObjects();
              return;
            }

            if (currentTool === 'image') {
              const input = document.createElement('input');
              input.type = 'file';
              input.accept = 'image/*';
              input.onchange = (ev) => {
                const file = ev.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (r) => {
                  proj.objects.push({ type: 'image', src: r.target.result, x: lastX, y: lastY, w: 200, h: 150 });
                  localStorage.setItem('nexora_vyro_projects', JSON.stringify(state.vyroProjects));
                  renderObjects();
                };
                reader.readAsDataURL(file);
              };
              input.click();
              return;
            }

            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
          });

          canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.strokeStyle = currentTool === 'eraser' ? '#000000' : currentColor;
            ctx.lineWidth = currentTool === 'eraser' ? currentSize * 3 : currentSize;
            ctx.lineCap = 'round';
            if (currentTool === 'pencil' || currentTool === 'brush' || currentTool === 'eraser') {
              ctx.lineTo(x, y);
              ctx.stroke();
              lastX = x; lastY = y;
            }
          });

          canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            if (currentTool === 'line') { ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke(); }
            else if (currentTool === 'rect') { ctx.strokeRect(lastX, lastY, x - lastX, y - lastY); }
            else if (currentTool === 'circle') { ctx.beginPath(); ctx.arc(lastX, lastY, Math.sqrt((x-lastX)**2 + (y-lastY)**2), 0, Math.PI*2); ctx.stroke(); }
          });
        }

        renderMenu();
      }

      // ========== SETTINGS ==========

            content.querySelector('#pinInput').addEventListener('change', (e) => { state.pin = e.target.value || '1234'; localStorage.setItem('nexora_pin', state.pin); playSound('click'); });
            const autoToggle = content.querySelector('#autoToggle'); autoToggle.addEventListener('click', () => { playSound('click'); state.autoLogin = !state.autoLogin; autoToggle.classList.toggle('active', state.autoLogin); localStorage.setItem('nexora_auto', state.autoLogin); });

            content.querySelector('#shutdownBtn').addEventListener('click', () => { playSound('click'); showOverlay('Apagando NEXORA OS...', 3000, false); });
          } else if (tabId === 'network') {
            content.innerHTML = `<div class="setting-item"><span><i class="fa-solid fa-wifi"></i> Wi-Fi</span><div class="toggle active"></div></div><div class="setting-item"><span><i class="fa-brands fa-bluetooth-b"></i> Bluetooth</span><div class="toggle active"></div></div><div class="setting-item"><span><i class="fa-solid fa-plane"></i> Modo avión</span><div class="toggle"></div></div><div class="setting-item"><span><i class="fa-solid fa-shield-halved"></i> VPN</span><div class="toggle"></div></div><p style="margin-top:20px; opacity:0.6; font-size:0.8rem;">Red actual: NEXORA-5G (Conectado)</p>`;
          } else if (tabId === 'personalization') {
            content.innerHTML = `<div class="setting-item"><span><i class="fa-solid fa-palette"></i> Fondo de pantalla</span><select id="wallSelect" class="setting-select"><option value="space" ${state.wall==='space' && !state.customWall ? 'selected':''}>Espacio NEXORA</option><option value="nature" ${state.wall==='nature' ? 'selected':''}>Naturaleza</option><option value="logo" ${state.wall==='logo' ? 'selected':''}>Logo NEXORA</option><option value="custom" ${state.customWall ? 'selected':''}>Personalizado (Archivo)</option></select></div><div class="setting-item"><span><i class="fa-solid fa-file-image"></i> Subir fondo personalizado</span><input type="file" id="wallFileInput" accept="image/*" style="color:white;"></div><div class="setting-item"><span><i class="fa-solid fa-moon"></i> Modo oscuro</span><div class="toggle active"></div></div><div class="setting-item"><span><i class="fa-solid fa-sun"></i> Luz nocturna</span><div class="toggle"></div></div><div class="setting-item"><span><i class="fa-solid fa-text-height"></i> Tamaño de texto</span><input type="range" min="50" max="150" value="100" style="width:150px;"></div><div class="setting-item"><span><i class="fa-solid fa-bolt"></i> Animaciones</span><div class="toggle active"></div></div>`;
            content.querySelector('#wallSelect').addEventListener('change', (e) => { const val = e.target.value; if (val === 'custom') { content.querySelector('#wallFileInput').click(); return; } state.wall = val; state.customWall = null; osShell.dataset.wall = val; osShell.style.backgroundImage = ''; localStorage.setItem('nexora_wall', val); localStorage.removeItem('nexora_custom_wall'); playSound('click'); });
            content.querySelector('#wallFileInput').addEventListener('change', (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { state.customWall = ev.target.result; state.wall = 'custom'; osShell.dataset.wall = 'custom'; osShell.style.backgroundImage = `url('${ev.target.result}')`; localStorage.setItem('nexora_custom_wall', ev.target.result); localStorage.setItem('nexora_wall', 'custom'); playSound('open'); }; reader.readAsDataURL(file); });

            content.querySelector('#userNameInput').addEventListener('change', (e) => { playSound('click'); state.userName = e.target.value || 'Usuario NEXORA'; localStorage.setItem('nexora_username', state.userName); });

            content.innerHTML = `<div class="setting-item"><span><i class="fa-solid fa-location-dot"></i> Ubicación</span><div class="toggle active"></div></div><div class="setting-item"><span><i class="fa-solid fa-microphone"></i> Micrófono</span><div class="toggle"></div></div><div class="setting-item"><span><i class="fa-solid fa-camera"></i> Cámara</span><div class="toggle active"></div></div><div class="setting-item"><span><i class="fa-solid fa-chart-simple"></i> Datos de diagnóstico</span><div class="toggle"></div></div>`;
          } else if (tabId === 'apps') {
            content.innerHTML = `<p style="opacity:0.7; margin-bottom:15px;">Apps instaladas (${state.installedApps.length})</p>${state.installedApps.map(id => { const app = STORE_APPS.find(a => a.id === id); return app ? `<div class="setting-item"><span><i class="fa-solid ${app.icon}"></i> ${app.name} <span style="opacity:0.6; font-size:0.8rem;">(${app.size} GB)</span></span><button class="install-btn" style="background:#f34; color:white;" onclick="window.uninstallApp('${id}'); this.closest('.settings-content').innerHTML='<p>App desinstalada</p>';">Desinstalar</button></div>` : ''; }).join('') || '<p style="opacity:0.5;">No hay apps instaladas.</p>'}`;
          } else if (tabId === 'storage') {
            const info = getStorageInfo();

      // ========== NOVA BROWSER ==========

        }

        const canvas = container.querySelector('#gameCanvas'); const ctx = canvas.getContext('2d'); const overlay = container.querySelector('#gameOverlay'); const startBtn = container.querySelector('#startGameBtn');
        let gameLoop, player = { x: canvas.width / 2 - 20, y: canvas.height - 60, w: 40, h: 40, speed: 7 }, bullets = [], enemies = [], score = 0, lives = 3, gameRunning = false, keys = {}, enemySpawnTimer = 0, lastTime = 0;
