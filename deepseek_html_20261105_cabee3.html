          else if (game.type === 'tower') { for (let i = 0; i < 15; i++) { const geo = new THREE.BoxGeometry(3, 1, 3); const mat = new THREE.MeshStandardMaterial({ color: 0x4ecdc4 }); const block = new THREE.Mesh(geo, mat); block.position.set((Math.random() - 0.5) * 10, i * 1.2, (Math.random() - 0.5) * 10); block.castShadow = true; scene.add(block); obstacles.push(block); } }
          else if (game.type === 'racer') { for (let i = 0; i < 30; i++) { const geo = new THREE.BoxGeometry(1, 2, 1); const mat = new THREE.MeshStandardMaterial({ color: 0xffd700 }); const cone = new THREE.Mesh(geo, mat); cone.position.set((Math.random() - 0.5) * 30, 1, (Math.random() - 0.5) * 30); cone.castShadow = true; scene.add(cone); obstacles.push(cone); } }
          else if (game.type === 'explorer') { for (let i = 0; i < 50; i++) { const geo = new THREE.BoxGeometry(1 + Math.random() * 3, 1 + Math.random() * 5, 1 + Math.random() * 3); const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.5, 0.5) }); const cube = new THREE.Mesh(geo, mat); cube.position.set((Math.random() - 0.5) * 40, (1 + Math.random() * 5) / 2, (Math.random() - 0.5) * 40); cube.castShadow = true; cube.receiveShadow = true; scene.add(cube); obstacles.push(cube); } }
          else if (game.type === 'maze') { for (let i = 0; i < 30; i++) { const geo = new THREE.BoxGeometry(2, 3, 2); const mat = new THREE.MeshStandardMaterial({ color: 0xff9f1c }); const wall = new THREE.Mesh(geo, mat); wall.position.set((Math.random() - 0.5) * 25, 1.5, (Math.random() - 0.5) * 25); wall.castShadow = true; scene.add(wall); obstacles.push(wall); } }
          else if (game.type === 'jumper') { for (let i = 0; i < 25; i++) { const geo = new THREE.BoxGeometry(1.5, 0.5, 1.5); const mat = new THREE.MeshStandardMaterial({ color: 0xc77dff }); const platform = new THREE.Mesh(geo, mat); platform.position.set((Math.random() - 0.5) * 20, i * 1.2 + 1, (Math.random() - 0.5) * 20); platform.castShadow = true; platform.receiveShadow = true; scene.add(platform); obstacles.push(platform); } }
          for (let i = 0; i < 10; i++) { const geo = new THREE.SphereGeometry(0.4, 8, 8); const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 0.5 }); const coin = new THREE.Mesh(geo, mat); coin.position.set((Math.random() - 0.5) * 20, 0.5, (Math.random() - 0.5) * 20); coin.castShadow = true; scene.add(coin); coins.push(coin); }
          camera.position.set(0, 5, 10); camera.lookAt(player.position);
          const keys = {}; let score = 0; let gameRunning = true;
          const keyHandler = (e) => { keys[e.key] = true; if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault(); };
          const keyUpHandler = (e) => { keys[e.key] = false; };
          window.addEventListener('keydown', keyHandler); window.addEventListener('keyup', keyUpHandler);
          const hud = document.createElement('div'); hud.style.cssText = 'position:absolute; top:60px; right:20px; background:rgba(0,0,0,0.7); padding:10px 20px; border-radius:10px; z-index:10; color:white;'; hud.innerHTML = `Puntos: <span id="bloxScore">0</span>`; container3d.appendChild(hud);
          const scoreEl = hud.querySelector('#bloxScore');
          function animate() {
            if (!gameRunning) return; requestAnimationFrame(animate);
            const speed = 0.15; if (keys['ArrowUp'] || keys['w'] || keys['W']) player.position.z -= speed; if (keys['ArrowDown'] || keys['s'] || keys['S']) player.position.z += speed; if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.position.x -= speed; if (keys['ArrowRight'] || keys['d'] || keys['D']) player.position.x += speed;
            player.rotation.y += 0.05;
            camera.position.x = player.position.x; camera.position.z = player.position.z + 8; camera.position.y = player.position.y + 4; camera.lookAt(player.position);
            coins.forEach((coin, index) => { coin.rotation.y += 0.05; if (player.position.distanceTo(coin.position) < 1) { scene.remove(coin); coins.splice(index, 1); score += 10; scoreEl.textContent = score; playSound('shoot'); } });
            obstacles.forEach(obs => { if (player.position.distanceTo(obs.position) < 1.2) { player.position.x -= (player.position.x - obs.position.x) * 0.5; player.position.z -= (player.position.z - obs.position.z) * 0.5; } });
            renderer.render(scene, camera);
          }
          animate();
          backBtn.addEventListener('click', () => { gameRunning = false; window.removeEventListener('keydown', keyHandler); window.removeEventListener('keyup', keyUpHandler); buildNexoblox(container); playSound('close'); });
        }
        menu.querySelectorAll('.blox-game-card').forEach(card => { card.addEventListener('click', () => { const gameId = card.dataset.game; const game = games.find(g => g.id === gameId); if (game) playGame3D(game); }); });
      }

      // ========== GENERIC APP ==========
      function buildGenericApp(container, appId) {
        const app = STORE_APPS.find(a => a.id === appId);
        let contentHtml = '';
        if (appId === 'code') contentHtml = `<textarea style="width:100%; height:200px; background:#000; color:#0f0; font-family:monospace; border:none; padding:10px; border-radius:8px; resize:none;">function hello() {\n  console.log("Hello NEXORA");\n}</textarea><button class="install-btn" style="margin-top:10px;" onclick="alert('Código ejecutado')">Ejecutar</button>`;
        else if (appId === 'terminal') contentHtml = `<div style="background:#000; color:#0f0; font-family:monospace; padding:15px; border-radius:8px; height:200px; overflow-y:auto;"><div>NEXORA OS Terminal v1.0</div><div>Escribe "help" para ver comandos.</div><div>> <input type="text" style="background:transparent; border:none; color:#0f0; outline:none; font-family:monospace; width:80%;" onkeydown="if(event.key==='Enter'){this.parentElement.innerHTML += this.value + '<br>> '; this.value='';}"></div></div>`;
        else if (appId === 'video') contentHtml = `<div style="text-align:center; padding:40px;"><i class="fa-solid fa-video" style="font-size:4rem; color:var(--accent); margin-bottom:20px;"></i><h2>Video Player</h2><p style="opacity:0.7; margin-bottom:20px;">Selecciona un video de la Galería</p><button class="install-btn" onclick="window.openApp('gallery')">Abrir Galería</button></div>`;
        else contentHtml = `<p style="opacity:0.7; text-align:center; padding:40px;">Esta aplicación está funcionando correctamente.</p>`;
        container.innerHTML = `<div style="display:flex; flex-direction:column; height:100%;"><h2 style="margin-bottom:15px; display:flex; align-items:center; gap:10px;"><i class="fa-solid ${app ? app.icon : 'fa-cube'}" style="color:var(--accent);"></i> ${app ? app.name : 'App'}</h2><div style="flex:1; overflow-y:auto;">${contentHtml}</div></div>`;
      }

      // ========== OVERLAY & LOCK ==========
      function showOverlay(message, duration, isRestart) {
        overlayMessage.textContent = message; systemOverlay.classList.remove('hidden');
        if (isRestart) { setTimeout(() => { state.windows = []; renderWindows(); systemOverlay.classList.add('hidden'); showLockScreen(true); }, duration); }
        else { setTimeout(() => { document.body.innerHTML = `<div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; color:#fff; font-family:var(--font);"><i class="fa-solid fa-power-off" style="font-size:3rem; margin-bottom:20px;"></i><h1>NEXORA OS apagado</h1><p style="opacity:0.5; margin-top:10px;">Puedes cerrar esta pestaña.</p></div>`; }, duration); }
      }

      function showLockScreen(isRestart = false) {
        lockScreen.classList.remove('hidden');
        lockScreen.innerHTML = `<div class="lock-user"><div class="lock-avatar"><i class="fa-solid fa-user"></i></div><h2>${state.userName}</h2><p style="opacity:0.6; font-size:0.9rem;">${isRestart ? 'Sistema reiniciado correctamente' : 'Inicia sesión para continuar'}</p>${state.autoLogin ? `<button class="lock-btn" id="autoLoginBtn">Entrar como ${state.userName}</button>` : `<input type="password" class="lock-input" id="lockPin" placeholder="PIN" maxlength="4"><button class="lock-btn" id="unlockBtn">Iniciar Sesión</button>`}</div>`;
        if (state.autoLogin) { document.getElementById('autoLoginBtn').addEventListener('click', () => { playSound('open'); lockScreen.classList.add('hidden'); }); }
        else { const pinInput = document.getElementById('lockPin'); document.getElementById('unlockBtn').addEventListener('click', () => { if (pinInput.value === state.pin) { playSound('open'); lockScreen.classList.add('hidden'); } else { playSound('error'); alert('PIN incorrecto. (Pista: 1234)'); } }); pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('unlockBtn').click(); }); pinInput.focus(); }
      }

      // ========== EVENT LISTENERS ==========
      document.getElementById('startBtn').addEventListener('click', (e) => { e.stopPropagation(); playSound('click'); document.getElementById('nexoraMenuBtn').click(); });
      document.getElementById('wifiBtn').addEventListener('click', (e) => { e.stopPropagation(); playSound('click'); quickPanel.classList.toggle('hidden'); });
      document.getElementById('btBtn').addEventListener('click', (e) => { e.stopPropagation(); playSound('click'); quickPanel.classList.toggle('hidden'); });
      document.getElementById('notifBtn').addEventListener('click', (e) => { e.stopPropagation(); playSound('click'); alert('Notificaciones: Todo al día.'); });
      document.getElementById('trayBtn').addEventListener('click', (e) => { e.stopPropagation(); playSound('click'); quickPanel.classList.toggle('hidden'); });
      document.getElementById('searchBtn').addEventListener('click', () => { playSound('click'); openApp('nova'); });

      // ========== INIT ==========
      if (state.customWall) { osShell.dataset.wall = 'custom'; osShell.style.backgroundImage = `url('${state.customWall}')`; } else { osShell.dataset.wall = state.wall; }
      renderDesktopIcons(); renderTaskbarApps(); showLockScreen(false);
      window.openApp = openApp;
    })();
  </script>
</body>
